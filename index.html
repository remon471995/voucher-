<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Khamees Travel Voucher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* إلغاء طباعة رابط الويب سايت والتاريخ ورؤوس الصفحات */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f9;
            color: #2c3e50;
            text-align: left;
            direction: ltr;
        }

        .voucher-container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        /* الهيدر بنظام جدول صريح لمنع التداخل */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-table td {
            vertical-align: middle;
        }
        .header-left {
            width: 25%;
            text-align: left;
        }
        .header-left .badge {
            display: inline-block;
            background: #d9534f;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-center {
            width: 50%;
            text-align: center;
        }
        .header-center h2 {
            margin: 0 0 3px 0;
            color: #004085;
            font-size: 18px;
            font-weight: 700;
        }
        .header-center p {
            margin: 1px 0;
            font-size: 12px;
            color: #555;
            font-weight: 600;
        }
        .header-right {
            width: 25%;
            text-align: right;
        }
        .header-right img {
            max-height: 55px;
            max-width: 140px;
            object-fit: contain;
        }

        .section-title {
            background-color: #ebf3fc;
            padding: 6px 12px;
            margin-top: 14px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-weight: 700;
            color: #004085;
            border-left: 4px solid #0056b3;
            font-size: 13px;
            text-transform: uppercase;
            text-align: left;
        }

        .fields-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 10px 6px;
            margin: -6px -10px 0 -10px;
        }
        .fields-table tr {
            page-break-inside: avoid;
        }
        .fields-table td {
            vertical-align: top;
            padding: 0;
        }
        .fields-table td.col-half {
            width: 50%;
        }
        .fields-table td.col-full {
            width: 100%;
        }

        .field-box {
            display: block;
            width: 100%;
            text-align: left;
        }
        .field-box label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 3px;
            text-align: left;
        }
        .field-box input,
        .field-box select,
        .field-box textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            color: #1a202c;
            background-color: #fff;
            text-align: left;
            direction: ltr;
        }
        .field-box input:focus,
        .field-box select:focus,
        .field-box textarea:focus {
            border-color: #0056b3;
            outline: none;
        }
        .field-box textarea {
            resize: vertical;
            min-height: 55px;
            line-height: 1.4;
        }

        .print-val {
            display: none;
            padding: 5px 8px;
            border: 1px solid #718096;
            border-radius: 4px;
            font-size: 12px;
            color: #111;
            background: #fff;
            min-height: 28px;
            line-height: 1.35;
            word-break: break-word;
            white-space: pre-wrap;
            text-align: left;
            direction: ltr;
        }

        .room-card {
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            page-break-inside: avoid;
            text-align: left;
        }
        .room-card h4 {
            margin: 0 0 8px 0;
            color: #0056b3;
            font-size: 13px;
            border-bottom: 1px dashed #cbd5e0;
            padding-bottom: 3px;
            text-align: left;
        }

        .actions-bar {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .actions-bar button {
            background-color: #0056b3;
            color: #fff;
            border: none;
            padding: 9px 22px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 6px;
        }

        /* عند الطباعة */
        @media print {
            body {
                background: #fff !important;
                padding: 10mm !important;
                margin: 0 !important;
            }
            .voucher-container {
                border: 1px solid #a0aec0 !important;
                box-shadow: none !important;
                padding: 15px 20px !important;
                max-width: 100% !important;
            }
            .actions-bar {
                display: none !important;
            }
            .section-title {
                margin-top: 10px !important;
                margin-bottom: 6px !important;
                padding: 4px 8px !important;
                font-size: 12px !important;
            }
            .fields-table {
                border-spacing: 8px 5px !important;
                margin: -5px -8px 0 -8px !important;
            }
            .field-box label {
                font-size: 11px !important;
                margin-bottom: 2px !important;
            }
            .field-box input,
            .field-box select,
            .field-box textarea {
                display: none !important;
            }
            .print-val {
                display: block !important;
                border: 1px solid #666 !important;
            }
        }
    </style>
</head>
<body>

<div class="voucher-container" id="voucherContainer">
    <table class="header-table">
        <tr>
            <td class="header-left">
                <span class="badge">Voucher</span>
            </td>
            <td class="header-center">
                <h2>Al Khamees Travel and Tourism</h2>
                <p>Tel: (+965) 1899777</p>
                <p style="direction: rtl;">للإتصال أو واتساب</p>
            </td>
            <td class="header-right">
                <img src="image_68fcf5.png" alt="Logo" onerror="this.style.display='none'">
            </td>
        </tr>
    </table>

    <div class="section-title">Booking Details</div>
    <table class="fields-table">
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="bookingRef">Booking Ref.:</label>
                    <input type="text" id="bookingRef" value="LK4Z9S">
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="date">Date:</label>
                    <input type="date" id="date">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="provider">Provider:</label>
                    <input type="text" id="provider" value="Al Khamees Travel and Tourism">
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="agentName">Agent Name:</label>
                    <input type="text" id="agentName" value="Amr elaraby">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
    </table>

    <div class="section-title">Hotel Details</div>
    <table class="fields-table">
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="hotelName">Hotel Name:</label>
                    <input type="text" id="hotelName" value="Hilton AbuDhabi Yas Island 5 Stars">
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="hotelTel">Hotel Phone Number:</label>
                    <input type="text" id="hotelTel" value="971-2-2086888">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
        <tr>
            <td colspan="2" class="col-full">
                <div class="field-box">
                    <label for="hotelAddress">Hotel Address:</label>
                    <input type="text" id="hotelAddress" value="P.O.Box 144876, Yas Bay, Yas Island, Abu Dhabi, United Arab Emirates">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
    </table>

    <div class="section-title">Accommodation Details</div>
    <table class="fields-table">
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="holderName">Holder Name:</label>
                    <input type="text" id="holderName" value="faisal aldosari">
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="board">Board:</label>
                    <select id="board">
                        <option value="Room Only" selected>Room Only</option>
                        <option value="Bed & Breakfast">Bed & Breakfast</option>
                        <option value="Half Board">Half Board</option>
                        <option value="Full Board">Full Board</option>
                        <option value="All Inclusive">All Inclusive</option>
                        <option value="Ultra All Inclusive">Ultra All Inclusive</option>
                    </select>
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="arrivalDate">Arrival Date:</label>
                    <input type="date" id="arrivalDate" value="2026-09-22">
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="departureDate">Departure Date:</label>
                    <input type="date" id="departureDate" value="2026-09-26">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="nights">Nights:</label>
                    <input type="number" id="nights" value="4" readonly>
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half">
                <div class="field-box">
                    <label for="rooms">Number of Rooms:</label>
                    <input type="number" id="rooms" value="1" min="1" max="5">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
    </table>

    <div class="section-title">Room and Guest Details</div>

    <div class="room-card" id="roomCard1">
        <h4>Room 1</h4>
        <table class="fields-table">
            <tr>
                <td class="col-half">
                    <div class="field-box">
                        <label>Room Type:</label>
                        <input type="text" class="room-type" value="FAMILY CONNECTING RM THEME PARK ACCESS">
                        <div class="print-val"></div>
                    </div>
                </td>
                <td class="col-half">
                    <div class="field-box">
                        <label>Number of Persons in Room:</label>
                        <input type="number" class="room-persons" value="6" min="1">
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="col-full">
                    <div class="field-box">
                        <label>Guest Names:</label>
                        <textarea class="room-names" rows="4">ADULT 1 - faisal aldosari
ADULT 2 - sara aldosari
CHILD 1 - luluh aldosari - Age : 4
CHILD 2 - turkia aldosari - Age : 9
CHILD 3 - aljawharah aldosari - Age : 7
CHILD 4 - turki aldosari - Age : 2</textarea>
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="room-card" id="roomCard2" style="display: none;">
        <h4>Room 2</h4>
        <table class="fields-table">
            <tr>
                <td class="col-half">
                    <div class="field-box">
                        <label>Room Type:</label>
                        <input type="text" class="room-type" value="Standard Room">
                        <div class="print-val"></div>
                    </div>
                </td>
                <td class="col-half">
                    <div class="field-box">
                        <label>Number of Persons in Room:</label>
                        <input type="number" class="room-persons" value="1" min="1">
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="col-full">
                    <div class="field-box">
                        <label>Guest Names:</label>
                        <textarea class="room-names" rows="3"></textarea>
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="room-card" id="roomCard3" style="display: none;">
        <h4>Room 3</h4>
        <table class="fields-table">
            <tr>
                <td class="col-half">
                    <div class="field-box">
                        <label>Room Type:</label>
                        <input type="text" class="room-type" value="Standard Room">
                        <div class="print-val"></div>
                    </div>
                </td>
                <td class="col-half">
                    <div class="field-box">
                        <label>Number of Persons in Room:</label>
                        <input type="number" class="room-persons" value="1" min="1">
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="col-full">
                    <div class="field-box">
                        <label>Guest Names:</label>
                        <textarea class="room-names" rows="3"></textarea>
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="room-card" id="roomCard4" style="display: none;">
        <h4>Room 4</h4>
        <table class="fields-table">
            <tr>
                <td class="col-half">
                    <div class="field-box">
                        <label>Room Type:</label>
                        <input type="text" class="room-type" value="Standard Room">
                        <div class="print-val"></div>
                    </div>
                </td>
                <td class="col-half">
                    <div class="field-box">
                        <label>Number of Persons in Room:</label>
                        <input type="number" class="room-persons" value="1" min="1">
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="col-full">
                    <div class="field-box">
                        <label>Guest Names:</label>
                        <textarea class="room-names" rows="3"></textarea>
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="room-card" id="roomCard5" style="display: none;">
        <h4>Room 5</h4>
        <table class="fields-table">
            <tr>
                <td class="col-half">
                    <div class="field-box">
                        <label>Room Type:</label>
                        <input type="text" class="room-type" value="Standard Room">
                        <div class="print-val"></div>
                    </div>
                </td>
                <td class="col-half">
                    <div class="field-box">
                        <label>Number of Persons in Room:</label>
                        <input type="number" class="room-persons" value="1" min="1">
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="col-full">
                    <div class="field-box">
                        <label>Guest Names:</label>
                        <textarea class="room-names" rows="3"></textarea>
                        <div class="print-val"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="section-title">Cancellation and Amendment Policy</div>
    <table class="fields-table">
        <tr>
            <td class="col-half">
                <div class="field-box">
                    <label for="cancellationPolicy">Cancellation Policy:</label>
                    <select id="cancellationPolicy">
                        <option value="refundable" selected>Refundable</option>
                        <option value="non refundable non amendable">Non Refundable Non Amendable</option>
                    </select>
                    <div class="print-val"></div>
                </div>
            </td>
            <td class="col-half" id="refundableUntilCell">
                <div class="field-box">
                    <label for="refundableUntilDate">Refundable Until:</label>
                    <input type="date" id="refundableUntilDate" value="2026-09-16">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
        <tr id="penaltyRow">
            <td colspan="2" class="col-full">
                <div class="field-box">
                    <label for="cancellationPenalty">Cancellation Penalty:</label>
                    <input type="text" id="cancellationPenalty" value="0">
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
    </table>

    <div class="section-title">Other Notes</div>
    <table class="fields-table">
        <tr>
            <td colspan="2" class="col-full">
                <div class="field-box">
                    <label for="notes">Special Remarks / Notes:</label>
                    <textarea id="notes" rows="2">1 king bed and 2 double beds
free child cot</textarea>
                    <div class="print-val"></div>
                </div>
            </td>
        </tr>
    </table>

    <div class="actions-bar">
        <button type="button" onclick="prepareAndPrint()">طباعة الفاوتشر (Print)</button>
    </div>
</div>

<script>
    const container = document.getElementById('voucherContainer');
    const arrivalDateInput = document.getElementById('arrivalDate');
    const departureDateInput = document.getElementById('departureDate');
    const nightsInput = document.getElementById('nights');
    const roomsInput = document.getElementById('rooms');
    const roomCards = document.querySelectorAll('.room-card');
    const policySelect = document.getElementById('cancellationPolicy');
    const refCell = document.getElementById('refundableUntilCell');
    const penaltyRow = document.getElementById('penaltyRow');

    function calculateNights() {
        if (arrivalDateInput.value) departureDateInput.min = arrivalDateInput.value;
        const a = new Date(arrivalDateInput.value);
        const d = new Date(departureDateInput.value);
        if (arrivalDateInput.value && departureDateInput.value && d > a) {
            nightsInput.value = Math.ceil(Math.abs(d - a) / (1000 * 60 * 60 * 24));
        } else {
            nightsInput.value = '';
        }
        updatePrintVal(nightsInput);
    }

    function toggleRooms() {
        const count = Math.min(Math.max(parseInt(roomsInput.value) || 1, 1), roomCards.length);
        roomCards.forEach((card, idx) => {
            if (idx < count) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
                card.querySelectorAll('input, textarea').forEach(el => {
                    el.value = '';
                    updatePrintVal(el);
                });
            }
        });
        updatePrintVal(roomsInput);
    }

    function togglePolicy() {
        const isRef = policySelect.value === 'refundable';
        refCell.style.display = isRef ? 'table-cell' : 'none';
        penaltyRow.style.display = isRef ? 'table-row' : 'none';
        if (!isRef) {
            document.getElementById('refundableUntilDate').value = '';
            document.getElementById('cancellationPenalty').value = '';
        }
        updateAllPrintValues();
    }

    function updatePrintVal(el) {
        const box = el.closest('.field-box');
        if (!box) return;
        const pVal = box.querySelector('.print-val');
        if (!pVal) return;

        let val = el.value || '';
        if (el.tagName === 'SELECT') {
            val = el.options[el.selectedIndex]?.text || '';
        } else if (el.type === 'date' && val) {
            const pts = val.split('-');
            if (pts.length === 3) val = `${pts[2]}/${pts[1]}/${pts[0]}`;
        }
        pVal.textContent = val;
    }

    function updateAllPrintValues() {
        container.querySelectorAll('input, select, textarea').forEach(updatePrintVal);
    }

    container.addEventListener('input', (e) => {
        if (e.target === arrivalDateInput || e.target === departureDateInput) calculateNights();
        if (e.target === roomsInput) toggleRooms();
        updatePrintVal(e.target);
    });

    container.addEventListener('change', (e) => {
        if (e.target === policySelect) togglePolicy();
        updatePrintVal(e.target);
    });

    function prepareAndPrint() {
        updateAllPrintValues();
        window.print();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('date');
        if (!dateInput.value) dateInput.value = '2026-08-06';
        calculateNights();
        toggleRooms();
        togglePolicy();
        updateAllPrintValues();
    });
</script>
</body>
</html>
